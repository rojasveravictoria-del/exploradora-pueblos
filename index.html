<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exploradora de Pueblos Originarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: una sola columna tipo "cuaderno de expedición", franja de aguayo arriba, tarjetas grandes y tocables para una niña de 8 años.
   Un solo tema claro a propósito (colores de textil andino sobre cielo del altiplano); todos los colores se definen explícitos. */
:root {
  --sky: #EAF3FA;
  --paper: #FFFFFF;
  --ink: #1E2A44;
  --ink-soft: #55607A;
  --line: #D5E1EC;
  --sun: #FFC53D;
  --coral: #EE5B4F;
  --leaf: #23A160;
  --lake: #2E7BD6;
  --plum: #7A4FC9;
  --ok-bg: #E2F6EA;
  --bad-bg: #FDE7E4;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Verdana", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
}
.weave {
  height: 14px;
  background:
    repeating-linear-gradient(90deg,
      var(--coral) 0 18px, var(--sun) 18px 26px, var(--leaf) 26px 44px,
      var(--sun) 44px 52px, var(--lake) 52px 70px, var(--plum) 70px 78px);
}
.weave.thin { height: 8px; border-radius: 4px; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-align: left; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--ink); display: grid; place-items: center; font-size: 26px; }
.brand b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; display: block; }
.brand small { color: var(--ink-soft); font-size: 14px; }
.stars { font-family: var(--font-display); font-size: 20px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 4px 16px; display: flex; align-items: center; gap: 6px; }
.stars .s { color: var(--sun); font-size: 24px; line-height: 1; -webkit-text-stroke: 1px #C9921A; }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: 28px; }
h3 { font-size: 22px; }
.lead { color: var(--ink-soft); margin: 6px 0 0; max-width: 60ch; }
.eyebrow { font-family: var(--font-display); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }

section { margin-top: 28px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.peoples { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.card {
  background: var(--paper); border: 2px solid var(--line); border-radius: 18px;
  padding: 16px; text-align: left; color: var(--ink); font: inherit; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.card:focus-visible, button:focus-visible { outline: 4px solid var(--lake); outline-offset: 2px; }
.card .ico { font-size: 40px; line-height: 1; }
.card .name { font-family: var(--font-display); font-size: 21px; line-height: 1.1; }
.card .meta { font-size: 15px; color: var(--ink-soft); }
.card .badge { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.zone-norte { background: #FFF1D6; color: #8A5A00; }
.zone-centro { background: #E0F5E8; color: #17643C; }
.zone-sur { background: #E3EEFB; color: #1F5296; }
.zone-isla { background: #EFE7FB; color: #55309A; }
.game-card { border-width: 3px; }
.game-card .done { font-size: 14px; color: var(--leaf); font-weight: 700; }

.hero { display: grid; gap: 18px; grid-template-columns: 1.3fr 1fr; align-items: center; margin-top: 22px; }
.hero-art { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 14px; }
.hero-art svg { width: 100%; height: auto; display: block; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }

.btn {
  font-family: var(--font-display); font-size: 20px; border: 0; border-radius: 14px;
  padding: 10px 20px; cursor: pointer; background: var(--ink); color: #FFFFFF;
  box-shadow: 0 4px 0 #0B1222; transition: transform .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0B1222; }
.btn.light { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #C9921A; }
.btn.small { font-size: 16px; padding: 6px 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.back { margin-bottom: 14px; }

/* Ficha */
.ficha { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
.ficha-head { padding: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.ficha-head .big { font-size: 64px; line-height: 1; }
.ficha-body { padding: 4px 20px 20px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.dato { border: 2px dashed var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.dato .k { font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.dato p { margin: 4px 0 0; }
.words { padding: 0 20px 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { background: var(--sky); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 16px; }
.chip b { font-family: var(--font-display); }

/* Juegos */
.panel { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 20px; }
.progress { height: 12px; background: var(--sky); border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
.progress > i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .3s ease; }
.q { font-family: var(--font-display); font-size: clamp(22px, 4.5vw, 28px); line-height: 1.2; margin: 6px 0 14px; }
.opts { display: grid; gap: 10px; }
.opt {
  font: inherit; font-size: 19px; text-align: left; padding: 12px 16px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
  display: flex; gap: 12px; align-items: center;
}
.opt .l { font-family: var(--font-display); width: 32px; height: 32px; border-radius: 10px; background: var(--sky); display: grid; place-items: center; flex-shrink: 0; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.ok { background: var(--ok-bg); border-color: var(--leaf); }
.opt.bad { background: var(--bad-bg); border-color: var(--coral); }
.opt:disabled { cursor: default; }
.feedback { margin-top: 14px; padding: 12px 16px; border-radius: 14px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback b { font-family: var(--font-display); font-size: 20px; }
.speak { background: var(--sky); border: 2px solid var(--line); color: var(--ink); border-radius: 12px; padding: 4px 12px; font: inherit; font-size: 15px; cursor: pointer; }

/* Unir parejas y clasificar */
.match { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.match .col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.tile {
  font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--paper); color: var(--ink); cursor: pointer; text-align: left; min-height: 52px;
}
.tile.word { font-family: var(--font-display); font-size: 20px; }
.tile.sel { border-color: var(--lake); background: #E3EEFB; }
.tile.ok { border-color: var(--leaf); background: var(--ok-bg); cursor: default; }
.tile.shake { animation: shake .35s; border-color: var(--coral); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (max-width: 520px) { .match { grid-template-columns: 1fr 1.3fr; } .tile { font-size: 15px; } .tile.word { font-size: 17px; } }

.pool { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; min-height: 56px; }
.bins { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.bin { border: 3px dashed var(--line); border-radius: 18px; padding: 12px; background: var(--paper); font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.bin.ready { border-color: var(--lake); background: #F3F8FE; }
.bin h3 { font-size: 20px; }
.bin .hint { font-size: 14px; color: var(--ink-soft); }
.bin .in { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { font-size: 15px; background: var(--ok-bg); border: 2px solid var(--leaf); border-radius: 999px; padding: 2px 10px; }

/* Mapa */
.mapgame { display: grid; grid-template-columns: 1fr 1.1fr; gap: 16px; align-items: start; }
@media (max-width: 640px) { .mapgame { grid-template-columns: 1fr; } }
.mapgame svg { width: 100%; height: auto; max-height: 560px; display: block; }
.zone-hit { cursor: pointer; }
.zone-hit:focus-visible { outline: none; }
.zone-hit:focus-visible rect, .zone-hit:focus-visible circle { stroke: var(--lake); stroke-width: 5; }

.celebrate { text-align: center; padding: 28px 16px; }
.celebrate .big { font-size: 72px; line-height: 1; }
.celebrate .got { font-family: var(--font-display); font-size: 26px; margin: 10px 0 18px; }
.foot { margin-top: 36px; font-size: 14px; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="weave"></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="go-home" type="button" aria-label="Volver al inicio">
      <span class="brand-mark" aria-hidden="true">🧭</span>
      <span><b>Exploradora de Pueblos</b><small>Ciencias Sociales · 2º básico</small></span>
    </button>
    <div class="stars" aria-live="polite"><span class="s" aria-hidden="true">★</span><span id="star-count">0</span> estrellas</div>
  </header>
  <main id="app"></main>
  <p class="foot">Todo el contenido viene de las clases de pueblos originarios: Atacameño, Aymara, Mapuche, Rapa Nui, Selk'nam y Kawésqar.</p>
</div>

<script>
// ─────────────────────────────────────────────

const PUEBLOS = [
  { id: 'atacameno', name: 'Atacameño', ico: '🏜️', zone: 'norte', zoneLabel: 'Zona norte', vida: 'Sedentario',

  { id: 'aymara', name: 'Aymara', ico: '🦙', zone: 'norte', zoneLabel: 'Zona norte', vida: 'Sedentario',
    otro: 'Viven en el altiplano, una meseta muy alta entre montañas y volcanes.',
    datos: [
      ['Ubicación', 'El altiplano de la zona norte. Mañanas muy soleadas y noches muy heladas con vientos fuertes.'],
      ['Forma de vida', 'Sedentarios: se quedaban en sus poblados todo el año.'],
      ['Vivienda', 'La uta: paredes de piedras unidas con barro y techo de paja brava.'],

  { id: 'rapanui', name: 'Rapa Nui', ico: '🗿', zone: 'isla', zoneLabel: 'Isla en el océano Pacífico', vida: 'Sedentario',
    otro: 'Su isla está muy lejos del continente, rodeada de agua por todas partes.',
    datos: [

    ],
    palabras: [['Hare paenga', 'casa con forma de bote al revés'], ['Moái', 'escultura de piedra volcánica'], ['Totora', 'pasto seco del techo']] },
  { id: 'selknam', name: "Selk'nam", ico: '🏹', zone: 'sur', zoneLabel: 'Extremo sur', vida: 'Nómade',
    otro: 'Eran nómades terrestres: se movían caminando en familias siguiendo a los animales.',
    datos: [
      ['Ubicación', 'Isla Grande de Tierra del Fuego, en el extremo sur de Chile.'],

];
const P = Object.fromEntries(PUEBLOS.map(p => [p.id, p]));

// Preguntas: [pueblo, pregunta, opciones, índice correcto, explicación]
const PREGUNTAS = [
  ['atacameno', '¿Dónde vivía el pueblo atacameño?', ['En el Desierto de Atacama', 'En la selva lluviosa', 'En la costa central', 'En los bosques del sur'], 0, 'Vivían en el Desierto de Atacama, cerca del río Loa y de los oasis.'],

  ['atacameno', '¿Para qué usaban las caravanas de llamas los atacameños?', ['Para ir a la playa', 'Para intercambiar alimentos con pueblos vecinos', 'Para cazar guanacos', 'Para hacer moáis'], 1, 'Viajaban con llamas para hacer trueque de alimentos.'],

// ─────────────────────────────────────────────
//  Estado y progreso (guardado en este navegador)
// ─────────────────────────────────────────────
const KEY = 'exploradora-pueblos-v1';
let progress = { stars: 0, done: {} };
try { const raw = localStorage.getItem(KEY); if (raw) progress = { stars: 0, done: {}, ...JSON.parse(raw) }; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
function addStars(n) { progress.stars += n; save(); paintStars(); }
function markDone(id) { progress.done[id] = true; save(); }
function paintStars() { document.getElementById('star-count').textContent = progress.stars; }

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const zoneClass = z => ({ norte: 'zone-norte', centro: 'zone-centro', sur: 'zone-sur', isla: 'zone-isla' }[z]);

// Leer en voz alta (si el navegador lo permite)
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-CL'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const speakBtn = (text) => `<button type="button" class="speak" data-say="${esc(text)}">🔊 Escuchar</button>`;
app.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); });

function go(view, arg) {
  try { speechSynthesis.cancel(); } catch (e) {}
  VIEWS[view](arg);
  window.scrollTo({ top: 0 });
}
document.getElementById('go-home').addEventListener('click', () => go('home'));

// ─────────────────────────────────────────────
//  Mapa simplificado de Chile (para inicio y juego)
// ─────────────────────────────────────────────
function chileMap({ interactive = false, placed = {} } = {}) {
  const zones = [
    { z: 'norte',  label: 'Norte',            x: 150, y: 20,  h: 150, fill: '#FFE3A8' },
    { z: 'centro', label: 'Centro-sur',       x: 150, y: 180, h: 150, fill: '#BFE8CF' },
    { z: 'sur',    label: 'Extremo sur',      x: 150, y: 340, h: 150, fill: '#C7DCF6' },
  ];
  const tag = (z, x, y) => (placed[z] || []).map((id, i) =>
    `<text x="${x}" y="${y + i * 30}" font-size="22" font-family="Andika, Verdana, sans-serif" fill="#1E2A44">${P[id].ico} ${esc(P[id].name)}</text>`).join('');
  const hit = (z, inner) => interactive
    ? `<g class="zone-hit" data-zone="${z}" tabindex="0" role="button" aria-label="Zona ${z}">${inner}</g>` : `<g>${inner}</g>`;
  return `
  <svg viewBox="0 0 420 510" role="img" aria-label="Mapa simple de Chile por zonas y la Isla de Pascua">
    <rect x="0" y="0" width="420" height="510" rx="18" fill="#DCEBF8"/>
    <text x="16" y="34" font-size="16" font-family="Baloo 2, sans-serif" fill="#2E7BD6">Océano Pacífico</text>
    ${zones.map(o => hit(o.z, `
      <rect x="${o.x}" y="${o.y}" width="70" height="${o.h}" rx="16" fill="${o.fill}" stroke="#1E2A44" stroke-width="2"/>
      <text x="${o.x + 35}" y="${o.y + o.h / 2 + 6}" text-anchor="middle" font-size="15" font-family="Baloo 2, sans-serif" fill="#1E2A44" transform="rotate(-90 ${o.x + 35} ${o.y + o.h / 2})">${o.label}</text>`)).join('')}
    ${hit('isla', `
      <circle cx="60" cy="230" r="34" fill="#E2D5F8" stroke="#1E2A44" stroke-width="2"/>
      <text x="60" y="236" text-anchor="middle" font-size="22">🏝️</text>
      <text x="60" y="284" text-anchor="middle" font-size="14" font-family="Baloo 2, sans-serif" fill="#1E2A44">Isla de Pascua</text>`)}
    <g>${tag('norte', 232, 70)}${tag('centro', 232, 240)}${tag('sur', 232, 400)}${tag('isla', 12, 320)}</g>
  </svg>`;
}

  ficha(id) {
    const p = P[id];
    const i = PUEBLOS.indexOf(p);
    const next = PUEBLOS[(i + 1) % PUEBLOS.length];
    const lectura = `Pueblo ${p.name}. ${p.otro} ` + p.datos.map(([k, v]) => `${k}: ${v}`).join(' ');
    app.innerHTML = `
      <button class="btn light small back" type="button" id="b-back">← Volver</button>
      <article class="ficha">
        <div class="weave thin"></div>
        <div class="ficha-head">
          <span class="big" aria-hidden="true">${p.ico}</span>
          <div style="min-width:0;flex:1">
            <p class="eyebrow">Ficha del pueblo</p>
            <h2>${esc(p.name)}</h2>
            <div class="row" style="margin-top:6px">
              <span class="badge chip ${zoneClass(p.zone)}" style="border:0">${p.zoneLabel}</span>
              <span class="chip"><b>${p.vida}</b></span>
              ${speakBtn(lectura)}
            </div>
            <p class="lead">${esc(p.otro)}</p>
          </div>
        </div>
        <div class="ficha-body">
          ${p.datos.map(([k, v]) => `<div class="dato"><div class="k">${esc(k)}</div><p>${esc(v)}</p></div>`).join('')}
        </div>
        <div class="words">
          <h3>Palabras para recordar</h3>
          <div class="chips">${p.palabras.map(([w, d]) => `<span class="chip"><b>${esc(w)}</b>: ${esc(d)}</span>`).join('')}</div>
        </div>
      </article>
      <div class="row" style="margin-top:16px">
        <button class="btn sun" type="button" id="b-quiz">Preguntas de los ${esc(p.name)}</button>
        <button class="btn light" type="button" id="b-next">Siguiente: ${next.ico} ${esc(next.name)}</button>
      </div>`;
    document.getElementById('b-back').onclick = () => go('home');
    document.getElementById('b-quiz').onclick = () => go('quiz', id);
    document.getElementById('b-next').onclick = () => go('ficha', next.id);
  },

  // ── Quiz ──
  quiz(puebloId) {
    const pool = puebloId ? PREGUNTAS.filter(q => q[0] === puebloId) : PREGUNTAS;
    const qs = shuffle(pool).slice(0, puebloId ? pool.length : 10);
    let n = 0, good = 0;
    const title = puebloId ? `Quiz ${P[puebloId].name}` : 'Quiz de los pueblos';

    function render() {
      if (n >= qs.length) return finish();
      const [, q, opts, ans, why] = qs[n];
      const order = shuffle(opts.map((t, i) => ({ t, ok: i === ans })));
      app.innerHTML = `
        <button class="btn light small back" type="button" id="b-back">← Salir</button>
        <div class="panel">
          <div class="row" style="justify-content:space-between">
            <p class="eyebrow" style="margin:0">${esc(title)} · Pregunta ${n + 1} de ${qs.length}</p>
            ${speakBtn(q + ' ' + order.map((o, i) => `${'ABCD'[i]}: ${o.t}.`).join(' '))}
          </div>
          <div class="progress"><i style="width:${(n / qs.length) * 100}%"></i></div>
          <p class="q">${esc(q)}</p>
          <div class="opts">
            ${order.map((o, i) => `<button class="opt" type="button" data-ok="${o.ok}"><span class="l">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}
          </div>
          <div class="feedback" id="fb"></div>
          <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" type="button" id="b-next" hidden>Siguiente →</button></div>
        </div>`;
      document.getElementById('b-back').onclick = () => go(puebloId ? 'ficha' : 'home', puebloId);
      const fb = document.getElementById('fb');
      const nextBtn = document.getElementById('b-next');
      app.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
        const ok = btn.dataset.ok === 'true';
        app.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.ok === 'true') b.classList.add('ok'); });
        if (!ok) btn.classList.add('bad');
        if (ok) { good++; addStars(1); }
        fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
        fb.innerHTML = `<b>${ok ? '¡Muy bien! ⭐' : 'Casi…'}</b><br>${esc(why)}`;
        speak((ok ? '¡Muy bien! ' : 'Casi. ') + why);
        nextBtn.hidden = false;
        nextBtn.textContent = n + 1 >= qs.length ? 'Ver resultado' : 'Siguiente →';
        nextBtn.focus();
      });
      nextBtn.onclick = () => { n++; render(); };
    }
    function finish() {
      markDone('quiz');
      const pct = good / qs.length;
      app.innerHTML = `
        <div class="panel celebrate">
          <div class="big" aria-hidden="true">${pct >= 0.8 ? '🏆' : pct >= 0.5 ? '🌟' : '💪'}</div>
          <h2>${pct >= 0.8 ? '¡Eres una gran exploradora!' : pct >= 0.5 ? '¡Bien hecho!' : '¡Sigue practicando!'}</h2>
          <p class="got">Respondiste bien ${good} de ${qs.length} · ganaste ${good} ★</p>
          <div class="row" style="justify-content:center">
            <button class="btn sun" type="button" id="b-again">Jugar otra vez</button>
            <button class="btn light" type="button" id="b-home">Volver al inicio</button>
          </div>
        </div>`;
      document.getElementById('b-again').onclick = () => go('quiz', puebloId);
      document.getElementById('b-home').onclick = () => go('home');
    }
    render();
  },

  // ── Mapa ──
  mapa() {
    const pending = shuffle(PUEBLOS.map(p => p.id));
    const placed = { norte: [], centro: [], sur: [], isla: [] };
    let selected = null, mistakes = 0;

    function render(msg = '') {
      if (!pending.length) return finish();
      app.innerHTML = `
        <button class="btn light small back" type="button" id="b-back">← Salir</button>
        <div class="panel">
          <p class="eyebrow">¿Dónde vivían?</p>
          <h2>Elige un pueblo y después toca su zona en el mapa</h2>
          <div class="mapgame" style="margin-top:14px">
            <div>
              <div class="pool">
                ${pending.map(id => `<button type="button" class="tile word ${selected === id ? 'sel' : ''}" data-p="${id}">${P[id].ico} ${esc(P[id].name)}</button>`).join('')}
              </div>
              <p class="lead" id="msg" aria-live="polite">${msg || (selected ? `¿Dónde vivía el pueblo ${esc(P[selected].name)}? Toca el mapa.` : 'Primero toca un pueblo.')}</p>
            </div>
            <div>${chileMap({ interactive: true, placed })}</div>
          </div>
        </div>`;
      document.getElementById('b-back').onclick = () => go('home');
      app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { selected = b.dataset.p; render(); });
      app.querySelectorAll('[data-zone]').forEach(z => {
        const act = () => pick(z.dataset.zone);
        z.addEventListener('click', act);
        z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
      });
    }
    function pick(zone) {
      if (!selected) return render('Primero toca un pueblo.');
      const p = P[selected];
      if (p.zone === zone) {
        placed[zone].push(selected);
        pending.splice(pending.indexOf(selected), 1);
        selected = null;
        addStars(1);
        speak('¡Correcto!');
        render(`¡Correcto! Los ${esc(p.name)} vivían en: ${esc(p.zoneLabel)}. ⭐`);
      } else {
        mistakes++;
        speak('Intenta otra vez');
        render(`Ups, ahí no. Pista: ${esc(p.datos[0][1])}`);
      }
    }
    function finish() {
      markDone('mapa');
      app.innerHTML = `
        <div class="panel celebrate">
          <div class="big" aria-hidden="true">🗺️</div>
          <h2>¡Ubicaste a los 6 pueblos!</h2>
          <p class="got">${mistakes === 0 ? 'Sin ningún error. ¡Increíble!' : `Con ${mistakes} intento${mistakes > 1 ? 's' : ''} de más.`} Ganaste 6 ★</p>
          <div style="max-width:420px;margin:0 auto 18px">${chileMap({ placed })}</div>
          <div class="row" style="justify-content:center">
            <button class="btn sun" type="button" id="b-again">Jugar otra vez</button>
            <button class="btn light" type="button" id="b-home">Volver al inicio</button>
          </div>
        </div>`;
      document.getElementById('b-again').onclick = () => go('mapa');
      document.getElementById('b-home').onclick = () => go('home');
    }
    render();
  },

  // ── Une las parejas ──
  parejas(setId) {
    if (!setId) {
      app.innerHTML = `
        <button class="btn light small back" type="button" id="b-back">← Volver</button>
        <h2>Une las parejas</h2>
        <p class="lead">Elige un grupo de palabras.</p>
        <div class="grid" style="margin-top:14px">
          ${PAREJAS.map(s => `<button class="card" type="button" data-set="${s.id}"><span class="name">${esc(s.title)}</span><span class="meta">${s.pairs.length} parejas</span>${progress.done['parejas-' + s.id] ? '<span class="done" style="color:var(--leaf);font-weight:700;font-size:14px">✓ Completado</span>' : ''}</button>`).join('')}
        </div>`;
      document.getElementById('b-back').onclick = () => go('home');
      app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => go('parejas', b.dataset.set));
      return;
    }
    const set = PAREJAS.find(s => s.id === setId);
    const left = shuffle(set.pairs.map((p, i) => ({ t: p[0], i })));
    const right = shuffle(set.pairs.map((p, i) => ({ t: p[1], i })));
    const solved = new Set();
    let selL = null;

    function render() {
      app.innerHTML = `
        <button class="btn light small back" type="button" id="b-back">← Volver</button>
        <div class="panel">
          <p class="eyebrow">Une las parejas · ${solved.size} de ${set.pairs.length}</p>
          <h2>${esc(set.title)}</h2>
          <p class="lead">${esc(set.intro)} Toca una palabra de la izquierda y luego su pareja.</p>
          <div class="progress"><i style="width:${(solved.size / set.pairs.length) * 100}%"></i></div>
          <div class="match">
            <div class="col">${left.map(o => `<button type="button" class="tile word ${solved.has(o.i) ? 'ok' : ''} ${selL === o.i ? 'sel' : ''}" data-l="${o.i}" ${solved.has(o.i) ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>
            <div class="col">${right.map(o => `<button type="button" class="tile ${solved.has(o.i) ? 'ok' : ''}" data-r="${o.i}" ${solved.has(o.i) ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>
          </div>
        </div>`;
      document.getElementById('b-back').onclick = () => go('parejas');
      app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { selL = +b.dataset.l; speak(b.textContent); render(); });
      app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
        if (selL === null) { speak('Primero toca una palabra de la izquierda'); return; }
        if (+b.dataset.r === selL) {
          solved.add(selL); selL = null; addStars(1); speak('¡Muy bien!');
          if (solved.size === set.pairs.length) return finish();
          render();
        } else {
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); speak('Intenta otra vez');
        }
      });
    }
    function finish() {
      markDone('parejas'); markDone('parejas-' + set.id);
      app.innerHTML = `
        <div class="panel celebrate">
          <div class="big" aria-hidden="true">🔗</div>
          <h2>¡Uniste todas las parejas!</h2>
          <p class="got">Ganaste ${set.pairs.length} ★</p>
          <div class="row" style="justify-content:center">
            <button class="btn sun" type="button" id="b-more">Otro grupo de palabras</button>
            <button class="btn light" type="button" id="b-home">Volver al inicio</button>
          </div>
        </div>`;
      document.getElementById('b-more').onclick = () => go('parejas');
      document.getElementById('b-home').onclick = () => go('home');
    }
    render();
  },

  // ── Nómade o sedentario ──
  clasifica() {
    const pending = shuffle(PUEBLOS.map(p => p.id));
    const bins = { Sedentario: [], Nómade: [] };
    let selected = null, msg = 'Toca un pueblo y después el canasto correcto.';

    function render() {
      if (!pending.length) return finish();
      app.innerHTML = `
        <button class="btn light small back" type="button" id="b-back">← Salir</button>
        <div class="panel">
          <p class="eyebrow">¿Nómade o sedentario?</p>
          <h2>Pon a cada pueblo en su canasto</h2>
          <div class="pool" style="margin-top:14px">
            ${pending.map(id => `<button type="button" class="tile word ${selected === id ? 'sel' : ''}" data-p="${id}">${P[id].ico} ${esc(P[id].name)}</button>`).join('')}
          </div>
          <p class="lead" aria-live="polite" style="margin-bottom:14px">${msg}</p>
          <div class="bins">
            <button type="button" class="bin ${selected ? 'ready' : ''}" data-bin="Sedentario">
              <h3>🏠 Sedentario</h3><span class="hint">Vive en un lugar fijo</span>
              <span class="in">${bins.Sedentario.map(id => `<span class="mini">${P[id].ico} ${esc(P[id].name)}</span>`).join('')}</span>
            </button>
            <button type="button" class="bin ${selected ? 'ready' : ''}" data-bin="Nómade">
              <h3>🚶 Nómade</h3><span class="hint">Se traslada de un lugar a otro</span>
              <span class="in">${bins['Nómade'].map(id => `<span class="mini">${P[id].ico} ${esc(P[id].name)}</span>`).join('')}</span>
            </button>
          </div>
        </div>`;
      document.getElementById('b-back').onclick = () => go('home');
      app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { selected = b.dataset.p; msg = `¿El pueblo ${esc(P[selected].name)} era nómade o sedentario?`; render(); });
      app.querySelectorAll('[data-bin]').forEach(b => b.onclick = () => {
        if (!selected) { msg = 'Primero toca un pueblo.'; return render(); }
        const p = P[selected];
        if (p.vida === b.dataset.bin) {
          bins[b.dataset.bin].push(selected);
          pending.splice(pending.indexOf(selected), 1);
          addStars(1); speak('¡Correcto!');
          msg = `¡Correcto! ${esc(p.datos[1][1])} ⭐`;
          selected = null;
        } else {
          speak('Intenta otra vez');
          msg = `Ups, no. Pista: lee dónde vivían los ${esc(p.name)}: ${esc(p.datos[0][1])}`;
        }
        render();
      });
    }
    function finish() {
      markDone('clasifica');
      app.innerHTML = `
        <div class="panel celebrate">
          <div class="big" aria-hidden="true">🧺</div>
          <h2>¡Canastos completos!</h2>
          <p class="got">Ganaste 6 ★</p>
          <p class="lead" style="margin:0 auto 18px">Los Selk'nam eran nómades que caminaban, y los Kawésqar nómades que navegaban en canoa. Los demás vivían en un lugar fijo.</p>
          <div class="row" style="justify-content:center">
            <button class="btn sun" type="button" id="b-again">Jugar otra vez</button>
            <button class="btn light" type="button" id="b-home">Volver al inicio</button>
          </div>
        </div>`;
      document.getElementById('b-again').onclick = () => go('clasifica');
      document.getElementById('b-home').onclick = () => go('home');
    }
    render();
  },
};

paintStars();
go('home');
</script>
</body>
</html>
